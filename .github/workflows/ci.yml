name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            builder-ai/server/package-lock.json
            builder-ai/client/package-lock.json

      - name: Install server dependencies
        working-directory: builder-ai/server
        run: npm ci

      - name: Run server tests
        working-directory: builder-ai/server
        run: npm test

      - name: Install client dependencies
        working-directory: builder-ai/client
        run: npm ci

      - name: Build client
        working-directory: builder-ai/client
        run: npm run build
